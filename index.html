<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%BASE_URL%icon.png" />

    <!--
      這裡刻意不放 <title>。React 19 會把每個路由自己的 <title>
      提升到 <head> 裡，但它不會去重，而 document.title 是被定義成
      文件裡「第一個」title 元素 -- 這裡如果放一個佔位符，就會永遠
      蓋過每個路由的設定。見 src/components/layout/PageMeta.tsx。
    -->

    <!--
      取代了以前 next/font 產生的 preload hint。即使是同源，
      crossorigin 也是必要的：字體是以 CORS 模式抓取的，沒有它的話
      瀏覽器會把每個檔案下載兩次。bold-italic 這個字體是 LCP
      （150px 的 hero 文字標誌），所以放在最前面。
    -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/LibreBodoni-BoldItalic.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/LibreBodoni-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/KronaOne-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body class="border-box relative h-screen w-screen bg-lightGray">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
